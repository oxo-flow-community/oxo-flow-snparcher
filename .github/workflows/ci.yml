name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The markdup/no-markdup `when` gates use `{meta.*}` per-sample baking
      # (engine PR #234 — after v0.16.0), so build the engine from source
      # pinned to a known-good main commit instead of the release tarball.
      # Bump the SHA to current engine main to pick up newer engine fixes.
      - name: Install oxo-flow (pinned engine main build)
        run: |
          git clone --depth 1 https://github.com/Traitome/oxo-flow.git oxo-flow-src
          cd oxo-flow-src
          git fetch --depth 1 origin 1d279b5980c55be0c8b35060ae6b345c7e092b12
          git checkout 1d279b5980c55be0c8b35060ae6b345c7e092b12
          cargo build --release -p oxo-flow-cli
          sudo mv target/release/oxo-flow /usr/local/bin/
          cd ..
          oxo-flow --version

      - name: Validate, lint, dry-run
        run: ./test/run.sh
